<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ponscan</title>
<style>
  :root{
    --bg:#0e1013; --panel:#15181d; --line:#242932; --ink:#e6e9ef; --dim:#8b94a3;
    --up:#3fb950; --down:#f0883e; --accent:#58a6ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
  header{display:flex;align-items:baseline;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line)}
  h1{font-size:14px;margin:0;letter-spacing:.08em;text-transform:uppercase}
  .stats{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:0;height:calc(100vh - 49px)}
  .list,.card{overflow-y:auto;padding:12px 18px}
  .card{border-left:1px solid var(--line)}
  table{width:100%;border-collapse:collapse}
  th{position:sticky;top:0;background:var(--bg);text-align:left;font-weight:400;color:var(--dim);
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid #1b1f26;vertical-align:top}
  tr.row{cursor:pointer}
  tr.row:hover td{background:#1a1e25}
  tr.row.sel td{background:#1d232c}
  .p{font-variant-numeric:tabular-nums;font-weight:600}
  .rank{color:var(--dim);font-variant-numeric:tabular-nums}
  .sym{font-weight:600}
  .nm{color:var(--dim)}
  .reasons{margin:2px 0 0;padding:0;list-style:none;color:var(--dim);font-size:12px}
  .reasons li:before{content:"+ ";color:var(--up)}
  .reasons li.down:before{content:"- ";color:var(--down)}
  .empty{color:var(--dim);padding:40px 8px;text-align:center}
  h2{font-size:13px;margin:0 0 2px;letter-spacing:.04em}
  .muted{color:var(--dim)}
  .big{font-size:30px;font-variant-numeric:tabular-nums;font-weight:600;line-height:1.1}
  section{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
  section h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);margin:0 0 8px;font-weight:400}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
  dt{color:var(--dim)}
  dd{margin:0;overflow-wrap:anywhere}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .tag{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--dim)}
  .tag.good{color:var(--up);border-color:#1d4327}
  .tag.warn{color:var(--down);border-color:#4a3320}
  .addr{font-size:12px}
  ul.plain{list-style:none;margin:0;padding:0}
  ul.plain li{padding:3px 0;border-bottom:1px solid #1b1f26}
  .disclaimer{color:var(--dim);font-size:11px;padding:10px 18px;border-top:1px solid var(--line)}
  .modes{margin-left:auto;display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .modes button{background:none;border:0;color:var(--dim);font:inherit;font-size:12px;
    padding:4px 12px;cursor:pointer}
  .modes button:hover{color:var(--ink)}
  .modes button[aria-pressed="true"]{background:#1d232c;color:var(--ink)}
  .shown{color:var(--dim);font-size:11px;padding:0 8px 8px}
  tr.row.fresh td{animation:landed 2.5s ease-out}
  @keyframes landed{from{background:#1c2b1f}to{background:transparent}}
</style>
</head>
<body>
<header>
  <h1>ponscan</h1>
  <span class="stats" id="stats">loading…</span>
  <div class="modes">
    <button id="m-score" aria-pressed="true">by chance</button>
    <button id="m-new" aria-pressed="false">newest</button>
  </div>
</header>

<div class="wrap">
  <div class="list">
    <table>
      <thead><tr><th style="width:64px">chance</th><th style="width:56px">rank</th><th>token</th><th style="width:60px">age</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="shown" id="shown"></div>
    <div class="empty" id="empty" hidden></div>
  </div>
  <div class="card" id="card"><div class="empty">select a launch</div></div>
</div>

<div class="disclaimer">
  The number is a model's estimate of one thing only: whether this launch reaches its graduation
  threshold. It is not advice, not a safety rating, and not a claim about price. Check the facts below it.
</div>

<script>
const $ = (id) => document.getElementById(id);
let selected = null;

/**
 * "by chance" ranks the window; "newest" reads it in launch order. The rank column means the same
 * thing in both: a launch's place by score. Seeing a fresh launch land at #12 of 2,400 is the whole
 * point of the newest view — the ordering answers "what just happened", the rank answers "does it
 * matter".
 */
let order = localStorage.getItem("ponscan.order") === "new" ? "new" : "score";
/** Tokens already on screen, so an arrival can be marked as one. */
let known = new Set();

function setOrder(next) {
  if (next === order) return;
  order = next;
  localStorage.setItem("ponscan.order", order);
  $("m-score").setAttribute("aria-pressed", String(order === "score"));
  $("m-new").setAttribute("aria-pressed", String(order === "new"));
  known = new Set();
  loadFeed();
}

const age = (ts) => {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 90) return s + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  return (s / 3600).toFixed(1) + "h";
};
const pct = (p) => (100 * p).toFixed(1) + "%";
const shortAddr = (a) => a ? a.slice(0, 8) + "…" + a.slice(-6) : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const colour = (p) => p >= 0.06 ? "var(--up)" : p >= 0.03 ? "var(--down)" : "var(--dim)";

async function loadFeed() {
  const r = await fetch("/api/feed?hours=6&sort=" + order);
  const d = await r.json();
  const c = d.counts;
  $("stats").textContent =
    `${c.launches.toLocaleString()} launches indexed · ${c.graduations.toLocaleString()} graduated · ${c.enriched.toLocaleString()} enriched`;

  if (!d.hasModel) {
    $("empty").hidden = false;
    $("empty").textContent = "no model yet — run: npm run train";
    return;
  }
  const tb = $("rows");
  tb.innerHTML = "";
  $("shown").textContent = d.inWindow
    ? `showing ${d.shown} of ${d.inWindow.toLocaleString()} launches in the last 6 hours`
    : "";
  if (!d.items.length) {
    $("empty").hidden = false;
    $("empty").textContent = "no launches in the last 6 hours";
    return;
  }
  $("empty").hidden = true;

  const first = known.size === 0;
  for (const it of d.items) {
    const m = it.meta || {};
    const tr = document.createElement("tr");
    // Only mark arrivals once a baseline exists, or the whole first render flashes.
    const fresh = !first && !known.has(it.token);
    tr.className = "row" + (it.token === selected ? " sel" : "") + (fresh ? " fresh" : "");
    tr.onclick = () => openCard(it.token);
    tr.innerHTML =
      `<td class="p" style="color:${colour(it.probability)}">${pct(it.probability)}</td>` +
      `<td class="rank">#${it.rank}</td>` +
      `<td><span class="sym">${esc(m.symbol || "?")}</span> <span class="nm">${esc((m.name || "").slice(0, 30))}</span>` +
      (m.graduated ? ' <span class="tag good">graduated</span>' : "") +
      `<ul class="reasons">${it.reasons.map((x) => `<li class="${x.direction === "up" ? "up" : "down"}">${esc(x.text)}</li>`).join("")}</ul></td>` +
      `<td class="rank">${m.ts ? age(m.ts) : ""}</td>`;
    tb.appendChild(tr);
  }
  known = new Set(d.items.map((it) => it.token));
}

async function openCard(token) {
  selected = token;
  document.querySelectorAll("tr.row").forEach((t) => t.classList.remove("sel"));
  const r = await fetch("/api/token/" + token);
  if (!r.ok) { $("card").innerHTML = '<div class="empty">not found</div>'; return; }
  const { card: k, score } = await r.json();
  const L = k.launch;

  const row = (dt, dd) => `<dt>${dt}</dt><dd>${dd}</dd>`;
  const txLink = (url, label) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;

  const exempt = k.exemptions.length
    ? `<ul class="plain">${k.exemptions.map((e) =>
        `<li>${txLink(e.url, shortAddr(e.address))} <span class="muted">${
          e.seenInOtherLaunches ? "seen in " + e.seenInOtherLaunches + " other launch(es)" : "not seen elsewhere"}</span></li>`).join("")}</ul>`
    : '<span class="muted">none declared</span>';

  const history = k.creatorHistory.recent.length
    ? `<ul class="plain">${k.creatorHistory.recent.map((h) =>
        `<li>${txLink(h.url, esc(h.symbol || h.token.slice(0, 10)))} <span class="muted">${age(h.ts)} ago</span> ` +
        (h.graduated ? '<span class="tag good">graduated</span>' : '<span class="tag">did not</span>') + "</li>").join("")}</ul>`
    : '<span class="muted">no earlier launches from this creator</span>';

  const C = k.cluster;
  const clusterLabel = {
    unique: "no other launch has used this ticker",
    swarm: `${C.total} launches share this ticker, from ${C.distinctCreators} different creators`,
    "repeat-spam": `${C.total} launches share this ticker, but only ${C.distinctCreators} creator${C.distinctCreators === 1 ? "" : "s"} behind them`,
  }[C.kind];
  const clusterTag = C.kind === "swarm" ? '<span class="tag good">crowd</span>'
    : C.kind === "repeat-spam" ? '<span class="tag warn">one wallet repeating</span>' : "";
  const clusterBlock = C.total > 1 ? `
    <section><h3>same ticker</h3>
      <div class="muted" style="margin-bottom:6px">${esc(clusterLabel)} ${clusterTag}<br>
        ${C.before} came before this one, ${C.after} after, ${C.graduated} of the whole group reached the pool.
        ${C.isFirstSeen ? "This was the first use of the ticker." : ""}</div>
      <ul class="plain">${C.siblings.map((sb) =>
        `<li>${txLink(sb.url, esc(sb.symbol || sb.token.slice(0, 10)))} <span class="muted">${age(sb.ts)} ago</span> ` +
        (sb.graduated ? '<span class="tag good">pool</span>' : '<span class="tag">no</span>') +
        (sb.sameCreator ? ' <span class="tag warn">same creator</span>' : "") + "</li>").join("")}</ul>
    </section>` : "";

  const feeChanges = k.fees.changes.length
    ? `<ul class="plain">${k.fees.changes.map((c) =>
        `<li>${shortAddr(c.prev)} → ${shortAddr(c.next)} ${txLink(c.txUrl, "tx")}</li>`).join("")}</ul>`
    : "";

  $("card").innerHTML = `
    <h2>${esc(k.symbol || "?")} <span class="muted">${esc(k.name || "")}</span></h2>
    <div class="muted addr">${txLink(L.txUrl, k.token)}</div>
    ${score ? `<div style="margin:14px 0 2px"><span class="big" style="color:${colour(score.probability)}">${pct(score.probability)}</span>
      <span class="muted"> chance of graduating · rank #${score.rank} of ${score.of} in the last 6h</span></div>
      <ul class="reasons">${score.reasons.map((x) => `<li class="${x.direction === "up" ? "up" : "down"}">${esc(x.text)}</li>`).join("")}</ul>` : ""}
    ${k.description ? `<p class="muted">${esc(k.description.slice(0, 300))}</p>` : ""}

    <section><h3>launch</h3><dl>
      ${row("transaction", txLink(L.txUrl, L.tx.slice(0, 18) + "…"))}
      ${row("when", new Date(L.ts * 1000).toISOString().replace("T", " ").slice(0, 19) + " UTC")}
      ${row("creator", txLink(L.creatorUrl, shortAddr(L.creator)))}
      ${L.viaContract ? row("called via", `<span class="tag warn">${shortAddr(L.calledBy)}</span> batching contract`) : ""}
      ${row("bought themselves", L.selfBuy === null
        ? '<span class="muted">not declared through the router</span>'
        : esc(L.selfBuy) + " " + esc(L.quoteSymbol))}
      ${row("quote asset", L.isEthQuoted ? "ETH" : `${esc(L.quoteSymbol)} ${txLink("https://robinhoodchain.blockscout.com/token/" + L.quoteAsset, shortAddr(L.quoteAsset))}`)}
      ${row("graduation needs", esc(L.threshold) + " " + esc(L.quoteSymbol))}
      ${row("ongoing creator tax", L.creatorTaxBps === null ? '<span class="muted">unknown</span>' : (L.creatorTaxBps / 100).toFixed(2) + "%")}
      ${L.buybackEnabled !== null ? row("buyback", L.buybackEnabled ? "enabled" : "off") : ""}
    </dl></section>

    <section><h3>wallets exempted from the opening tax</h3>
      <div class="muted" style="margin-bottom:6px">Buys are taxed 99% at launch, decaying to zero over 3 seconds. These wallets were waived.</div>
      ${exempt}
    </section>

    <section><h3>fees</h3><dl>
      ${row("creator fees go to", k.fees.recipient ? txLink(k.fees.recipientUrl, shortAddr(k.fees.recipient)) : '<span class="muted">unknown</span>')}
      ${k.fees.redirected ? row("", '<span class="tag warn">routed away from the launching wallet</span>') : ""}
    </dl>${feeChanges}</section>

    ${clusterBlock}

    <section><h3>this creator's earlier launches</h3>
      <div class="muted" style="margin-bottom:6px">${k.creatorHistory.priorLaunches} before this one, ${k.creatorHistory.priorGraduations} of which had graduated by launch time.</div>
      ${history}
    </section>

    <section><h3>outcome</h3><dl>
      ${row("phase", ["on the curve", "swept", "in the pool", "rescued"][L_phase(k)] || "?")}
      ${k.outcome.graduated
        ? row("graduated", txLink(k.outcome.graduationTxUrl, "tx") + (k.outcome.secondsToGraduate !== null
            ? ` <span class="muted">after ${Math.round(k.outcome.secondsToGraduate / 60)} min</span>` : ""))
        : row("graduated", '<span class="muted">not yet</span>')}
    </dl></section>

    ${Object.keys(k.socials).length ? `<section><h3>links</h3><ul class="plain">${
      Object.entries(k.socials).map(([n, v]) => `<li>${esc(n)}: ${txLink(esc(v), esc(v.slice(0, 60)))}</li>`).join("")}</ul></section>` : ""}
  `;
}
function L_phase(k) { return k.outcome.phase; }

loadFeed();
$("m-score").onclick = () => setOrder("score");
$("m-new").onclick = () => setOrder("new");
$("m-score").setAttribute("aria-pressed", String(order === "score"));
$("m-new").setAttribute("aria-pressed", String(order === "new"));
setInterval(loadFeed, 15000);
</script>
</body>
</html>
